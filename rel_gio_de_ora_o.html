<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relógio de Oração - Assembleia de Deus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="min-h-screen pb-20">
    <!-- Toast de Notificação -->
    <div
      id="toast"
      class="fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg text-white font-medium text-sm transition-opacity duration-300 opacity-0 pointer-events-none z-50 bg-red-500"
    >
      Mensagem
    </div>

    <!-- Tela de Carregamento -->
    <div
      id="loading"
      class="fixed inset-0 bg-blue-900 flex flex-col items-center justify-center z-40 transition-opacity duration-500"
    >
      <div
        class="w-12 h-12 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin mb-4"
      ></div>
      <p class="text-yellow-400 font-semibold text-lg">
        Conectando ao Relógio...
      </p>
    </div>

    <!-- Cabeçalho -->
    <header
      class="bg-blue-900 text-white pt-8 pb-10 px-4 text-center rounded-b-3xl shadow-lg relative z-0"
    >
      <h2
        class="text-yellow-400 font-bold tracking-wider text-sm uppercase mb-1"
      >
        Assembleia de Deus (Rua 10)
      </h2>
      <h1 class="text-3xl font-bold mb-2">Relógio de Oração</h1>
      <p class="text-blue-200 text-sm max-w-md mx-auto">
        07 de Novembro 21:00 às 08 de Novembro 21:00<br />
        Limite de 2 pessoas por hora.
      </p>
    </header>

    <!-- Barra de Input Flutuante -->
    <div class="sticky top-0 z-20 px-4 py-3 -mt-6">
      <div
        class="bg-white rounded-2xl shadow-xl p-4 max-w-2xl mx-auto border border-gray-100 flex flex-col sm:flex-row gap-3 items-center"
      >
        <div class="w-full flex-1 relative">
          <svg
            class="w-5 h-5 absolute left-3 top-3 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            ></path>
          </svg>
          <input
            type="text"
            id="userName"
            class="w-full bg-gray-50 text-gray-800 rounded-xl py-3 pl-10 pr-4 outline-none focus:ring-2 focus:ring-yellow-400 focus:bg-white transition-all"
            placeholder="Digite seu nome completo aqui"
          />
        </div>
        <p class="text-xs text-gray-400 sm:w-1/3 text-center sm:text-left">
          Identifique-se primeiro, depois escolha seu horário abaixo.
        </p>
      </div>
    </div>

    <!-- Lista de Horários -->
    <main class="px-4 pt-8 max-w-5xl mx-auto">
      <div
        id="slotsContainer"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
      >
        <!-- Injetado via JS -->
      </div>
    </main>

    <!-- Integração com Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
      // Importamos funções adicionais para Deletar (doc, deleteDoc)
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        query,
        serverTimestamp,
        getDocs,
        where,
        doc,
        deleteDoc,
      } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBV4u7ZS6lTdt6FszcQ-QStW07IOU5Vhls",
        authDomain: "relogiooracao-f9714.firebaseapp.com",
        projectId: "relogiooracao-f9714",
        storageBucket: "relogiooracao-f9714.firebasestorage.app",
        messagingSenderId: "807429471116",
        appId: "1:807429471116:web:09a7dd2b1465b7434f34a9",
        measurementId: "G-4SVQSW6YJQ",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app, "relogiooracao");

      const listaHorarios = [
        "Sábado 07/11 - 21:00 às 22:00",
        "Sábado 07/11 - 22:00 às 23:00",
        "Sábado 07/11 - 23:00 às 00:00",
        "Domingo 08/11 - 00:00 às 01:00",
        "Domingo 08/11 - 01:00 às 02:00",
        "Domingo 08/11 - 02:00 às 03:00",
        "Domingo 08/11 - 03:00 às 04:00",
        "Domingo 08/11 - 04:00 às 05:00",
        "Domingo 08/11 - 05:00 às 06:00",
        "Domingo 08/11 - 06:00 às 07:00",
        "Domingo 08/11 - 07:00 às 08:00",
        "Domingo 08/11 - 08:00 às 09:00",
        "Domingo 08/11 - 09:00 às 10:00",
        "Domingo 08/11 - 10:00 às 11:00",
        "Domingo 08/11 - 11:00 às 12:00",
        "Domingo 08/11 - 12:00 às 13:00",
        "Domingo 08/11 - 13:00 às 14:00",
        "Domingo 08/11 - 14:00 às 15:00",
        "Domingo 08/11 - 15:00 às 16:00",
        "Domingo 08/11 - 16:00 às 17:00",
        "Domingo 08/11 - 17:00 às 18:00",
        "Domingo 08/11 - 18:00 às 19:00",
        "Domingo 08/11 - 19:00 às 20:00",
        "Domingo 08/11 - 20:00 às 21:00",
      ];

      const slotsContainer = document.getElementById("slotsContainer");
      const loading = document.getElementById("loading");

      let estadoAgendamentos = []; // Guarda a lista global de quem já orou para checar nomes duplicados

      function mostrarToast(mensagem, cor = "bg-red-500") {
        const toast = document.getElementById("toast");
        toast.innerText = mensagem;
        toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-lg text-white font-medium text-sm transition-opacity duration-300 z-50 ${cor} opacity-100`;
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 4000);
      }

      // Escuta o banco de dados em tempo real
      const q = query(collection(db, "agendamentos"));
      onSnapshot(q, (snapshot) => {
        const agendamentosDb = [];
        snapshot.forEach((doc) => {
          // Salvamos também o ID do documento para podermos deletar depois
          agendamentosDb.push({ id: doc.id, ...doc.data() });
        });
        estadoAgendamentos = agendamentosDb;
        atualizarInterface(agendamentosDb);
        loading.classList.add("opacity-0", "pointer-events-none");
      });

      // Função exposta globalmente para cancelar o agendamento
      window.cancelarAgendamento = async function (idDocumento) {
        if (confirm("Tem certeza que deseja sair deste horário?")) {
          try {
            await deleteDoc(doc(db, "agendamentos", idDocumento));

            // Remove o ID do armazenamento local do navegador
            let meus = JSON.parse(
              localStorage.getItem("meus_agendamentos") || "[]",
            );
            meus = meus.filter((id) => id !== idDocumento);
            localStorage.setItem("meus_agendamentos", JSON.stringify(meus));

            mostrarToast("Sua vaga foi liberada com sucesso!", "bg-green-500");
          } catch (error) {
            mostrarToast("Erro ao tentar cancelar a vaga.");
            console.error(error);
          }
        }
      };

      function atualizarInterface(agendamentosDb) {
        slotsContainer.innerHTML = "";

        // Puxa os IDs de quem foi agendado por este celular/computador
        const meusAgendamentos = JSON.parse(
          localStorage.getItem("meus_agendamentos") || "[]",
        );

        listaHorarios.forEach((hora) => {
          const ocupantes = agendamentosDb.filter((a) => a.horario === hora);
          const qtdOcupantes = ocupantes.length;
          const esgotado = qtdOcupantes >= 2;

          let htmlOcupantes = "";
          if (qtdOcupantes === 0) {
            htmlOcupantes = `<p class="text-sm text-gray-400 italic mb-3">Nenhum membro inscrito</p>`;
          } else {
            htmlOcupantes = `<ul class="text-sm text-gray-700 mb-3 space-y-2">`;
            ocupantes.forEach((ocupante) => {
              const ehMeuAgendamento = meusAgendamentos.includes(ocupante.id);
              htmlOcupantes += `
                <li class="flex items-center justify-between bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-100">
                  <span class="flex items-center truncate">
                    <span class="w-1.5 h-1.5 bg-yellow-400 rounded-full mr-2 flex-shrink-0"></span>
                    <span class="truncate">${ocupante.nome}</span>
                  </span>
                  ${ehMeuAgendamento ? `<button onclick="window.cancelarAgendamento('${ocupante.id}')" class="text-red-500 text-xs font-semibold hover:underline ml-2 flex-shrink-0">Sair</button>` : ""}
                </li>`;
            });
            htmlOcupantes += `</ul>`;
          }

          const card = document.createElement("div");
          card.className = `bg-white rounded-2xl shadow-sm border p-5 fade-in flex flex-col justify-between transition-all ${esgotado ? "border-red-200 bg-red-50" : "border-gray-100 hover:border-blue-300 hover:shadow-md"}`;

          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-blue-900 text-sm sm:text-base">${hora}</h3>
                <span class="text-xs font-semibold px-2 py-1 rounded-full ${esgotado ? "bg-red-100 text-red-600" : "bg-green-100 text-green-700"}">
                  ${esgotado ? "Esgotado" : `${2 - qtdOcupantes} vaga(s)`}
                </span>
              </div>
              ${htmlOcupantes}
            </div>
            <button 
              data-horario="${hora}"
              class="btn-agendar w-full py-2.5 rounded-xl font-semibold text-sm transition-colors mt-2 ${esgotado ? "bg-gray-200 text-gray-400 cursor-not-allowed" : "bg-blue-900 text-yellow-400 hover:bg-blue-800"}"
              ${esgotado ? "disabled" : ""}
            >
              ${esgotado ? "Horário Preenchido" : "Agendar este horário"}
            </button>
          `;
          slotsContainer.appendChild(card);
        });

        document.querySelectorAll(".btn-agendar").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const horarioEscolhido = e.target.getAttribute("data-horario");
            await agendar(horarioEscolhido, e.target);
          });
        });
      }

      async function agendar(horario, botaoRef) {
        const nome = document.getElementById("userName").value.trim();

        if (!nome) {
          mostrarToast(
            "Por favor, digite seu nome no topo da página primeiro.",
          );
          document.getElementById("userName").focus();
          return;
        }

        // VERIFICAÇÃO 1 (ATUALIZADA): Bloqueia apenas se o mesmo nome tentar entrar no MESMO horário
        const nomeJaNesteHorario = estadoAgendamentos.some(
          (a) =>
            a.horario === horario &&
            a.nome.toLowerCase() === nome.toLowerCase(),
        );

        if (nomeJaNesteHorario) {
          mostrarToast(
            "Você já preencheu uma vaga neste horário. Escolha um horário diferente.",
          );
          return;
        }

        botaoRef.disabled = true;
        botaoRef.innerText = "Salvando...";

        try {
          // VERIFICAÇÃO 2: Checa concorrência final no banco antes de gravar
          const qCheck = query(
            collection(db, "agendamentos"),
            where("horario", "==", horario),
          );
          const querySnapshot = await getDocs(qCheck);

          if (querySnapshot.size >= 2) {
            mostrarToast(
              "Desculpe, alguém acabou de pegar a última vaga neste exato momento!",
            );
            botaoRef.disabled = false;
            botaoRef.innerText = "Agendar este horário";
            return;
          }

          // Grava a vaga no banco
          const docRef = await addDoc(collection(db, "agendamentos"), {
            nome: nome,
            horario: horario,
            dataRegistro: serverTimestamp(),
          });

          // Salva o ID localmente para o botão "Sair" funcionar
          let meus = JSON.parse(
            localStorage.getItem("meus_agendamentos") || "[]",
          );
          meus.push(docRef.id);
          localStorage.setItem("meus_agendamentos", JSON.stringify(meus));

          document.getElementById("userName").value = "";
          mostrarToast("Agendamento realizado com sucesso!", "bg-green-500");
        } catch (error) {
          console.error("Erro: ", error);
          mostrarToast("Erro ao conectar ao banco. Tente novamente.");
          botaoRef.disabled = false;
          botaoRef.innerText = "Agendar este horário";
        }
      }
    </script>
  </body>
</html>
